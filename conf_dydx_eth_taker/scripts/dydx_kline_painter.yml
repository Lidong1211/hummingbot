########################################################
###     dYdX v4 Kline Painter Script Configuration   ###
########################################################

# 脚本文件名（必须与 scripts/ 下的文件名一致）
script_file_name: dydx_kline_painter.py

# 交易标的与连接器
taker_connector: dydx_v4_perpetual
trading_pair: ETH-USD

# 外部参考行情（若不需要外部行情对标，可留空，将默认对标本地盘口）
external_connector: null
external_trading_pair: null

# 画线打点参数
paint_interval: 20.0           # 每隔 30 秒打点一次
interval_jitter: 5.0           # 0~5 秒随机时间抖动（模拟真实散户交易）
trade_amount: 0.02              # 单次吃单打点成交量（满足交易所最小步长）

# 仓位与风控管理
max_inventory_limit: 10.0      # 最大允许单边净持仓，达到后会自动反向平仓归零
max_price_deviation_pct: 0.05  # 允许最大价格偏离 5%
